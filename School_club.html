<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School clubs</title>

    <link href="<link href=" https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
        crossorigin="anonymous">

    <style>
        body {
            background-color: #f9f9f9;
            font-family: arial, san-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #333366;
        }

        .club-card {
            text-align: center;
            border: 2px solid;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .science {
            background-color: #d1ecf1;
            border-color: blue;
        }

        .art {
            background-color: #fce4ec;
            border-color: deeppink;
        }

        .music {
            background-color: #fff3cd;
            border-color: orange;
        }
    </style>

</head>

<body>

    <h1>Our school club</h1>

    <div class="container">
        <div class="row">

            <div class="col-md-6 col-lg-4">
                <div class="club-card science">
                    <h3>Science club</h3>
                    <p>Explore expiriment, discoveries and innovation</p>
                </div>
            </div>
        </div>
    </div>

    div class="container">
    <div class="row">

        <div class="col-md-6 col-lg-4">
            <div class="club-card art">
                <h3>Develop creativity through drawing and painting</h3>
            </div>
        </div>
    </div>
    </div>

    div class="container">
    <div class="row">

        <div class="col-md-6 col-lg-4">
            <div class="club-card music">
                <h3>Music club</h3>
                <p>Discover talent through singing and instruments</p>
            </div>
        </div>
    </div>
    </div <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous">
    </script>"

</body>

</html>
